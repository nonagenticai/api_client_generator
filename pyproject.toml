[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apigen"]

[project]
license = "Apache-2.0"
name = "apigen"
version = "0.1.0"
description = "Modern OpenAPI client generator with native Pydantic v2 support"
authors = [
    { name = "API Client Generator" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.3",
    "click>=8.5.1",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "pyyaml>=6.0",
    "toml>=0.10",
    "openapi-spec-validator>=0.7",
    "jsonref>=1.1",
    "requests>=2.32.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=4.1",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=2.4.1",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0",
    "types-toml>=0.10",
    "types-requests>=2.33.0.20261030",
]

[project.scripts]
apigen = "apigen.cli:cli"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disable_error_code = ["import-untyped"]
# Generated example client and reference snippets: not part of the shipped package.
exclude = "(^|/)(test_clients|examples)/"

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
# Same exclusion as mypy and ruff above: generated clients are not the shipped package,
# and they carry the `Optional`-annotated-as-bool shapes the generator emits by design.
exclude = ["test_clients/**"]

[tool.ruff]
line-length = 100
target-version = "py311"
# `test_clients/` is a generated example client used to exercise apigen end to end.
# It is not part of the shipped package and is not lint-clean by construction.
extend-exclude = ["test_clients/"]

[tool.ruff.lint]
# Estate baseline for a public Python repo: pycodestyle errors, pyflakes, import
# sorting and warnings. Line length is enforced by the formatter, not the linter.
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=apigen --cov-report=term-missing"
